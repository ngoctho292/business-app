events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with X-Request-ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression for Fast LCP (Text, CSS, JS, SVG, JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Upstream services
    upstream backend_api {
        server host.docker.internal:4000;
        keepalive 32;
    }

    upstream renderer_app {
        server host.docker.internal:3000;
        keepalive 32;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Client body size for media uploads
        client_max_body_size 50M;

        # 1. API Route -> NestJS Backend
        location /v1/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Next.js Static Asset Caching (/_next/static/*) -> 1 Year Immutable
        location /_next/static/ {
            proxy_pass http://renderer_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 3. Media Public CDN Route -> MinIO media-public bucket
        location /media-public/ {
            proxy_pass http://minio_s3/media-public/;
            proxy_set_header Host $http_host;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            
            # Cache static assets 30 days
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        }

        # 4. All other requests -> Next.js Multi-tenant Renderer
        location / {
            proxy_pass http://renderer_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
